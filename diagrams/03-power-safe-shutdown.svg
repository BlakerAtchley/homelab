<text fill="#5b6573" dominant-baseline="text-after-edge" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" font-weight="400"><tspan xml:space="preserve" x="64" y="79" lengthAdjust="spacingAndGlyphs" textLength="221.7">HOME LAB · DRAWING 3 OF 4</tspan></text>
<text fill="#18202b" dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="700"><tspan xml:space="preserve" x="64" y="136" lengthAdjust="spacingAndGlyphs" textLength="457.8">Power + safe shutdown</tspan></text>
<text fill="#4a5462" dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400"><tspan xml:space="preserve" x="64" y="167" lengthAdjust="spacingAndGlyphs" textLength="799.3">Everything in the rack runs through the UPS, so a power blip never crashes a VM or corrupts a disk.</tspan></text>
<rect width="200" height="80" x="64" y="380" fill="#fff" stroke="#c9cfd8" rx="12" ry="12"/>
<g dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="15"><text fill="#18202b" font-weight="700"><tspan xml:space="preserve" x="125.2" y="419" lengthAdjust="spacingAndGlyphs" textLength="77.7">Wall outlet</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="144.4" y="440" lengthAdjust="spacingAndGlyphs" textLength="39.3">120 V</tspan></text>
</g>
<rect width="240" height="120" x="360" y="360" fill="#1e2227" rx="12" ry="12"/>
<g dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="15"><text fill="#f5f6f8" font-weight="700"><tspan xml:space="preserve" x="464.7" y="408.5" lengthAdjust="spacingAndGlyphs" textLength="30.5">UPS</tspan></text>
<g fill="#c9d0da" font-weight="400"><text><tspan xml:space="preserve" x="377" y="429.5" lengthAdjust="spacingAndGlyphs" textLength="206">CyberPower CP1500PFCLCD</tspan></text>
<text><tspan xml:space="preserve" x="381" y="450.5" lengthAdjust="spacingAndGlyphs" textLength="198">1500 VA / 1000 W, pure sine</tspan></text>
</g>
</g>
<rect width="220" height="80" x="696" y="380" fill="#2a2f36" rx="10" ry="10"/>
<g dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="15"><text fill="#f5f6f8" font-weight="700"><tspan xml:space="preserve" x="756.4" y="419" lengthAdjust="spacingAndGlyphs" textLength="60">10&quot; PDU</tspan></text>
<text fill="#f5f6f8" font-weight="400"><tspan xml:space="preserve" x="816.4" y="419" lengthAdjust="spacingAndGlyphs" textLength="39.2"> · U12</tspan></text>
<text fill="#c9d0da" font-weight="400"><tspan xml:space="preserve" x="738.8" y="440" lengthAdjust="spacingAndGlyphs" textLength="134.3">4 outlets + breaker</tspan></text>
</g>
<rect width="300" height="64" x="1040" y="296" fill="#fff" stroke="#1f5fd6" stroke-width="2" rx="10" ry="10"/>
<g dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="15"><text fill="#18202b" font-weight="700"><tspan xml:space="preserve" x="1121.2" y="327" lengthAdjust="spacingAndGlyphs" textLength="43.4">pve01</tspan></text>
<text fill="#18202b" font-weight="400"><tspan xml:space="preserve" x="1164.6" y="327" lengthAdjust="spacingAndGlyphs" textLength="94.2"> · NUT server</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="1113.8" y="348" lengthAdjust="spacingAndGlyphs" textLength="152.5">Lenovo 90 W adapter</tspan></text>
</g>
<rect width="300" height="64" x="1040" y="388" fill="#fff" stroke="#c9cfd8" rx="10" ry="10"/>
<g dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="15"><text fill="#18202b" font-weight="700"><tspan xml:space="preserve" x="1123" y="419" lengthAdjust="spacingAndGlyphs" textLength="46.4">pve02</tspan></text>
<text fill="#18202b" font-weight="400"><tspan xml:space="preserve" x="1169.5" y="419" lengthAdjust="spacingAndGlyphs" textLength="87.5"> · NUT client</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="1113.8" y="440" lengthAdjust="spacingAndGlyphs" textLength="152.5">Lenovo 90 W adapter</tspan></text>
</g>
<rect width="300" height="64" x="1040" y="480" fill="#fff" stroke="#c9cfd8" rx="10" ry="10"/>
<g dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="15"><text fill="#18202b" font-weight="700"><tspan xml:space="preserve" x="1164.9" y="511" lengthAdjust="spacingAndGlyphs" textLength="50.2">Switch</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="1102.2" y="532" lengthAdjust="spacingAndGlyphs" textLength="175.7">TP-Link SG2008 adapter</tspan></text>
</g>
<rect width="200" height="72" x="380" y="576" fill="#fff" stroke="#c9cfd8" rx="10" ry="10"/>
<g dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="15"><text fill="#18202b" font-weight="700"><tspan xml:space="preserve" x="423.6" y="611" lengthAdjust="spacingAndGlyphs" textLength="112.9">Modem / router</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="418.3" y="632" lengthAdjust="spacingAndGlyphs" textLength="123.4">keeps internet up</tspan></text>
</g>
<text fill="#5b6573" dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400"><tspan xml:space="preserve" x="626.3" y="408" lengthAdjust="spacingAndGlyphs" textLength="43.4">battery</tspan></text>
<text fill="#1f5fd6" dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400"><tspan xml:space="preserve" x="797" y="268" lengthAdjust="spacingAndGlyphs" textLength="96">USB data · NUT</tspan></text>
<g dominant-baseline="text-after-edge" font-family="Inter, system-ui, sans-serif" font-size="15"><text fill="#18202b" font-weight="700"><tspan xml:space="preserve" x="64" y="709" lengthAdjust="spacingAndGlyphs" textLength="94.9">In an outage:</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="158.9" y="709" lengthAdjust="spacingAndGlyphs" textLength="295.6"> when the battery runs low, NUT on pve01 </tspan><tspan xml:space="preserve" x="64" y="732" lengthAdjust="spacingAndGlyphs" textLength="410.3">tells pve02 to shut down, then shuts itself down. No VM is </tspan><tspan xml:space="preserve" x="64" y="755" lengthAdjust="spacingAndGlyphs" textLength="122.8">cut off mid-write.</tspan></text>
<text fill="#18202b" font-weight="700"><tspan xml:space="preserve" x="512" y="709" lengthAdjust="spacingAndGlyphs" textLength="154.8">When power returns:</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="666.8" y="709" lengthAdjust="spacingAndGlyphs" textLength="233.7"> set each M920q&apos;s BIOS to &quot;After </tspan><tspan xml:space="preserve" x="512" y="732" lengthAdjust="spacingAndGlyphs" textLength="382.7">power loss: Power On&quot; so the lab boots back up on its </tspan><tspan xml:space="preserve" x="512" y="755" lengthAdjust="spacingAndGlyphs" textLength="34.2">own.</tspan></text>
<text fill="#18202b" font-weight="700"><tspan xml:space="preserve" x="960" y="709" lengthAdjust="spacingAndGlyphs" textLength="59.6">Legend:</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="1019.6" y="709" lengthAdjust="spacingAndGlyphs" textLength="4.2"> </tspan></text>
<text fill="#c2570c" font-weight="600"><tspan xml:space="preserve" x="1023.9" y="709" lengthAdjust="spacingAndGlyphs" textLength="51">orange</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="1074.9" y="709" lengthAdjust="spacingAndGlyphs" textLength="70.3"> = power, </tspan></text>
<text fill="#1f5fd6" font-weight="600"><tspan xml:space="preserve" x="1145.1" y="709" lengthAdjust="spacingAndGlyphs" textLength="88.8">blue dashed</tspan></text>
<text fill="#4a5462" font-weight="400"><tspan xml:space="preserve" x="1233.9" y="709" lengthAdjust="spacingAndGlyphs" textLength="88.5"> = USB data.</tspan></text>
</g>
</svg>
